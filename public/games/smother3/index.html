		<script>
			function setup(){     //initial set up, call only when window is opened
                theBox = document.getElementById("gameboard");
                for (var ii = 0; ii < 22500; ii++){      //150 x 150 elements
                    divAdd = document.createElement("div");
                    theBox.appendChild(divAdd);
                    theBox.children[ii].className = "whiteBox";
				}
                player = new Thing;
                sbutton.innerHTML = "<br>CLICK HERE<br>TO START<br>ROUND 1";
            }
            function Thing(phase,pic,dir,locfrom,locto,xcoord,ycoord){     //constructor for Thing object, either player or wall
                this.phase = phase;
                this.pic = pic;
                this.dir = dir;          //dir = 0 for an object at rest, dir = -1 for absence of wall
                this.locfrom = locfrom;
                this.locto = locto;
                this.xcoord = xcoord;
                this.ycoord = ycoord;
            }

            function printIcon(pic,hor,ver){    //prints icon "pic" with upper left corner "hor" and "ver"
                locH = hor;
                locV = ver;
                for (ii = 0;ii<15; ii++){
                    for (jj = 0; jj<15; jj++){
                        hue = pic[ii][jj];
                        cell = locat.children[(ii+locV)*150+jj+locH];
                        cell.className = rainbow[hue]+"Box";
                    }
                }
            }

            function blank(blankh,blankv){
                locat = document.getElementById("gameboard")
                for (hh=0;hh<15;hh++){
                    for (vv=0;vv<15;vv++){
                        cell = locat.children[(blankh+hh+150*(blankv+vv))]
                        cell.className = "whiteBox";
                    }
                }
            }

            function blankboard(){
                for (bb=0;bb<22500;bb++){
                    gb = document
                    locat.children[bb].className = "whiteBox";
                }
            }

            

            function newGame(){
                round = 0;
                newRound();
            }

            function newRound(){
                blankboard();
                clearblock();
                sbutton.innerHTML = "";
                sbutton.className = "blankButton";
                player.dir = 0;        //player starts at rest in upper left corner, looking to the right
                player.pic = WALKR0;
                player.phase = 0;
                player.locfrom = 0;
                player.locto = 0;
                player.xcoord = 0;
                player.ycoord = 0;
                printPlayer();
                for (iii=0;iii<20;iii++){
                    walls[iii].phase = 0;
                    walls[iii].dir = -1;   //all walls asleep to start
                    locwall = allwalls[round][iii];
                    walls[iii].locfrom = locwall;
                    walls[iii].locto = locwall;
                    walls[iii].xcoord = (locwall%10)*15;
                    walls[iii].ycoord = 15*Math.floor(locwall/10);
                    walls[iii].pic = BLOCK0;
                    printIcon(walls[iii].pic,walls[iii].xcoord,walls[iii].ycoord);
                }
                printIcon(STAR,135,135);

                gameLoop();
            }

            function clearblock(){         //zeroes the "block" array
                for (jj=0;jj<100;jj++){
                    block[jj]=0;
                }
            }

            function setblock(){                //sets block array elements to 1 in each occupies space
                block[player.locfrom]=1;
                block[player.locto]=1;
                for (jj=0;jj<20;jj++){
                    block[walls[jj].locfrom]=1;
                    block[walls[jj].locto]=1;
                }
            }

            function printPlayer(){
                printIcon(player.pic, player.xcoord , player.ycoord);
            }


            function clicked(){
                if (gameflag==1){return;}  //does nothing during the game
                if (gameflag==0){   //new round
                    gameflag=1;
                    newRound();
                }
                if (gameflag==2){   //new game
                    gameflag=1;
                    newGame();
                }
            }

            
            function movePlayer(code){
                pickkey({ which: code });
            }
            function pickkey(theKey){     //initiated if key is pressed
                if (gameflag!=1){return;}   //clicking keys does nothing if game not in motion
                if (player.dir>0){return;}  //no action if player already in motion
                theKey = theKey.which;    //will need to check for collision
                locnow = player.locfrom;
                if (theKey==39){
                    if (locnow%10==9){return;}   //player in right column
                    if (block[locnow+1]==1){return;}   //space to the right is occupied
                    player.dir=right;
                    player.locto=player.locfrom+1;    //new location is one to the right of old location
       //             return;
                }
                else if (theKey==40){
                    if (locnow>89){return;}  //player on bottom row
                    if (block[locnow+10]==1){return;}   //space down one is occupied
                    player.dir=down;
                    player.locto=player.locfrom+10;
      //              return;
                }
                else if (theKey==37){
                    if (locnow%10==0){return;}  //player in left column
                    if (block[locnow-1]==1){return;}   //space to the left is occupied
                    player.dir=left;
                    player.locto=player.locfrom-1;
      //              return;
                }
                else if (theKey==38){
                    if (locnow<10){return;}    //player in top row
                    if (block[locnow-10]==1){return;}   //space one up is occupied
                    player.dir=up;
                    player.locto=player.locfrom-10;
       //             return;
                }
                block[player.locto]=1;
                return
            }

            function gameLoop(){
                clearblock();    //clears, then repopulates block array to show which spaces are empty
                setblock();
                if (player.dir>0){    //player is moving
                    blank(player.xcoord,player.ycoord);   //erase current image
                    player.phase++;
                    if (player.dir==right){
                        player.xcoord = player.xcoord+3;
                        player.pic = WalkR[player.phase];
                    }
                    else if (player.dir==down){
                        player.ycoord = player.ycoord+3;
                        player.pic = WalkD[player.phase];
                    }
                    else if (player.dir==left){
                        player.xcoord = player.xcoord-3;
                        player.pic = WalkL[player.phase];
                    }
                    else if (player.dir==up){
                        player.ycoord = player.ycoord-3;
                        player.pic = WalkU[player.phase];
                    }
                    printPlayer();
                    if (player.phase==5){     //finishes the step
                        player.phase = 0;
                        player.dir = 0;
                        player.locfrom = player.locto;
                    }
                }
                if (player.locfrom==99){     //completes the round
                    roundover();
                    return;
                }
                for (kk=0;kk<20;kk++){
                    movewall(kk);
                }
                    
                if (player.dir==0){    //checks if player is surrounded if player not moving
                    if (surround(player.locfrom)){
                        gamelost();return;
                    }
                }
                setTimeout(gameLoop,80 - 2*round);
            }

            function movewall(nn){
                if (walls[nn].dir>0){      //wall in motion, blank prior picture, advance phase
                    blank(walls[nn].xcoord,walls[nn].ycoord);
                    walls[nn].phase++

                    if (walls[nn].dir==left){
                        walls[nn].xcoord = walls[nn].xcoord-3;
                        walls[nn].pic = BlockL[walls[nn].phase];
                    }
                    else if (walls[nn].dir==right){
                        walls[nn].xcoord = walls[nn].xcoord+3;
                        walls[nn].pic = BlockR[walls[nn].phase];
                    }
                    else if (walls[nn].dir==up){
                        walls[nn].ycoord = walls[nn].ycoord-3;
                        walls[nn].pic = BlockU[walls[nn].phase];
                    }
                    else if (walls[nn].dir==down){
                        walls[nn].ycoord = walls[nn].ycoord+3;
                        walls[nn].pic = BlockD[walls[nn].phase];
                    }
                    printIcon(walls[nn].pic,walls[nn].xcoord,walls[nn].ycoord);
                    if (walls[nn].phase==5){     //move is finished
                        walls[nn].phase=0;
                        walls[nn].dir = -1;   //wall asleep
                        walls[nn].locfrom = walls[nn].locto;
                    }
                    return;
                }
                //wall not in motion
                if (walls[nn].dir==-1){     //wall asleep
            //        if (Math.random()*(active*2-round)>1){return;} 
                    if (Math.random()*(active*3-round*2)>1){return;} 
                    walls[nn].dir=0;     //wakes up
                    eyenum = Math.random();
                    if (eyenum<.25) {walls[nn].pic = LEFTEYE;}
                    else if (eyenum<.5) {walls[nn].pic = RIGHTEYE;}
                    else if (eyenum<.75){walls[nn].pic = UPEYE;}
                    else {walls[nn].pic = DOWNEYE;}
                    printIcon(walls[nn].pic,walls[nn].xcoord,walls[nn].ycoord);
                    return;
                }
                //wall awake
                if (Math.random()*(active-round)>1){return;}   //only initiates movement 1/active fraction of the time
                if (Math.random()<0.5){ //checks horizontal
                    if (player.xcoord>walls[nn].xcoord){
                        if (block[walls[nn].locfrom+1]==1){return;}   //block moving into is occupied
                        if (walls[nn].locfrom==98){return;}   //will not enter exit space
                        walls[nn].dir = right;
                        walls[nn].locto = walls[nn].locfrom+1;
                        block[walls[nn].locto]=1;  //blocks out space wall is moving into
                    }
                    else if (player.xcoord<walls[nn].xcoord){
                        if (block[walls[nn].locfrom-1]==1){return;}   //block moving into is occupied
                        walls[nn].dir = left;
                        walls[nn].locto = walls[nn].locfrom-1;
                        block[walls[nn].locto]=1;  //blocks out space wall is moving into
                    }
                    return;
                }
                else {       //checks vertical
                    if (player.ycoord>walls[nn].ycoord){
                        if (block[walls[nn].locfrom+10]==1){return;}   //block moving into is occupied
                        if (walls[nn].locfrom==89){return;}     //will not enter exit space
                        walls[nn].dir = down;
                        walls[nn].locto = walls[nn].locfrom+10;
                        block[walls[nn].locto]=1;  //blocks out space wall is moving into
                    }
                    else if (player.ycoord<walls[nn].ycoord){
                        if (block[walls[nn].locfrom-10]==1){return;}   //block moving into is occupied
                        walls[nn].dir = up;
                        walls[nn].locto = walls[nn].locfrom-10;
                        block[walls[nn].locto]=1;  //blocks out space wall is moving into
                    }
                }
            }

            function roundover(){
                round++;   //will need to check if round = 10
                if (round==10){gamewon();return}
                gameflag = 0;
                sbutton.className = "theButton";
                sbutton.innerHTML = "<br>CLICK HERE<br>TO START<br>ROUND "+(round+1);
            }

            function surround(zz){    //zz is player's current location
                if (zz>9){
                    if (empty(zz-10)){   //checks if space above is empty
                        return false;
                    }
                }
                if (zz<90){
                    if (empty(zz+10)){    //checks if space below is empty
                        return false;
                    }
                }
                if (zz%10 != 0){    //checks if space to left is empty
                    if (empty(zz-1)){
                        return false;
                    }
                }
                if (zz%10 != 9){    //checks if space to right is empty
                    if (empty(zz+1)){
                        return false;
                    }
                }
                return true;     //returns true if no adjacent spaces are empty
            }

            function empty(zzz){
                for (iter = 0;iter<20;iter++){
                    if ((walls[iter].dir<1)){    //only checks walls at rest
                        if (walls[iter].locto==zzz){
                            return false;
                        }
                    }
                }
                return true;
            }

            function gamelost(){
                gameflag = 2;
                sbutton.className = "theButton";
                sbutton.innerHTML = "YOU HAVE<br>LOST!!!!<br>CLICK HERE<br>TO PLAY<br>AGAIN";
            }

            function gamewon(){
                gameflag = 2;
                sbutton.className = "theButton";
                sbutton.innerHTML = "YOU HAVE<br>WON!!!!<br>CLICK HERE<br>TO PLAY<br>AGAIN";
            }


		</script>
